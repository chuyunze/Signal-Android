name: Build Self-host APK

on:
  push:
    branches: [ selfhost-patch ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 正常全量构建约 30 分钟；卡死时快速失败而不是跑满 6 小时

    steps:
    - name: Checkout Signal-Android
      uses: actions/checkout@v4
      with:
        path: android
        lfs: true

    - name: Checkout patched libsignal
      uses: actions/checkout@v4
      with:
        repository: chuyunze/libsignal
        ref: selfhost
        path: libsignal

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up Rust (nightly pinned by libsignal + Android target)
      run: |
        rustup toolchain install nightly-2026-07-15 --profile minimal
        # arm64 真机只需要 aarch64；如需全 ABI，追加：
        #   armv7-linux-androideabi x86_64-linux-android i686-linux-android
        rustup target add aarch64-linux-android --toolchain nightly-2026-07-15

    - name: Cache Rust (libsignal cargo registry + arm64 编译产物)
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: libsignal
        key: android-arm64

    - name: Install protoc (libsignal/spqr 编译期依赖)
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install Android NDK 28
      run: |
        SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses > /dev/null
        yes | "$SDKMANAGER" "ndk;28.0.13004108"

    - name: Configure build
      working-directory: android
      run: |
        # 以 composite build 方式从源码编译补丁版 libsignal
        echo "libsignalClientPath=../libsignal" >> gradle.properties
        # 只编译 arm64 的 Rust JNI 库（同时写入主工程和 included build
        # 的 gradle.properties，确保 -P 属性能被 libsignal 构建读到）
        echo "androidArchs=arm64" >> gradle.properties
        echo "androidArchs=arm64" >> ../libsignal/java/gradle.properties
        # 从源码构建 libsignal 时，其构建插件(spotless/dokka 等)不在主工程的
        # verification-metadata.xml 白名单内，按官方注释放宽校验为 lenient
        echo "org.gradle.dependency.verification=lenient" >> gradle.properties
        echo "org.gradle.dependency.verification=lenient" >> ../libsignal/java/gradle.properties
        # GitHub runner 为 16GB 内存：Gradle 8g + Kotlin 4g(官方默认，不能调小，
        # 巨型工程 codegen 阶段堆太小会 GC 死循环表现为构建挂死)，留 4g 给系统
        sed -i 's/-Xmx12g/-Xmx8g/' gradle.properties

    - name: Build APK
      working-directory: android
      run: |
        # NDK 路径传给 libsignal 的 build_jni.sh
        export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
        # website 渠道在 selectableVariants 白名单里只启用了 spinner(=debug 等价，
        # 不混淆、debug 签名) 和 release(R8 混淆)；测试包用 spinner。
        # app 模块在 settings.gradle.kts 被重命名为 :Signal-Android。
        # --console=plain 让日志逐行输出任务名，卡住时能直接看到卡在哪个任务。
        ./gradlew :Signal-Android:assembleWebsiteProdSpinner \
          -PandroidArchs=arm64 \
          -Dorg.gradle.dependency.verification=lenient \
          --console=plain \
          --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Sixin-selfhost-arm64-spinner
        path: android/app/build/outputs/apk/websiteProd/spinner/*.apk
        if-no-files-found: error

    - name: Archive reports on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: |
          android/**/build/reports
          android/**/build/outputs/logs
        if-no-files-found: ignore
